[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noslop"
version = "0.1.0"
description = "Korean AI-slop prevention pipeline: session rules, reference quarantine, deterministic gate, review skills"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.optional-dependencies]
docs = ["python-docx", "python-pptx"]
morph = ["kiwipiepy"]

[project.scripts]
noslop = "noslop.cli:main"

[tool.setuptools]
packages = ["noslop"]
include-package-data = true

[tool.setuptools.package-data]
noslop = ["../rules/rules.yaml"]
