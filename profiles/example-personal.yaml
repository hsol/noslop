# 개인 오버레이 예시. ~/.noslop/profile.yaml 로 복사해 쓴다. 공개 정본(rules.yaml)에는 개인 습관을 넣지 않는다.
block:
  - id: P01
    name: 거든요 어미
    why: 문장 끝에 이유를 덧붙이는 어미가 AI 말투로 읽힌다고 본인이 반복 지적. 평서로 닫는다.
    regex: "거든요"
  - id: P02
    name: 그러나
    why: 본인 코퍼스에서 "하지만" 121회 대 "그러나" 8회. 문어 접속사는 쓰지 않는다.
    regex: "(?:^|[\\s.])그러나[\\s,]"
  - id: P03
    name: have 직역
    why: "~을 가지고 있다" 는 소유 구문 직역이다. "~가 있다" 로 쓴다.
    regex: "(?:을|를)\\s*가지고 있(?:다|습니다|어요)"
  - id: P04
    name: 자기 과거 글 인용 프레임
    why: 자기 게시물을 "썼다, 적었다, 올렸다" 로 가리키면 취재자 화법이 된다.
    regex: "라고 (?:썼|적었)|써놨었|올렸었"
disable: []
registers:
  social: {emoji_max: 2}
